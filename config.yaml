# crier production config
# every slug below returned HTTP 200 on a live probe (first batch
# 2026-07-06, expansion batch 2026-07-07).
# pushover creds live in config.local.yaml, NOT here
#
# coverage model: slugs are the fast lane (~60s latency) for companies
# I care about. the github feeds are the dragnet that catches startups
# I've never heard of, at their 5-30 min refresh lag. see a company
# repeatedly in feed alerts? promote it to a slug

db_path: crier.db

filter:
  # includes stay recall-first (wide net), the excludes below do the
  # precision work. title passes if it matches ANY of these (go regexp
  # syntax). this set was audited against 11,906 real titles from the
  # seeded db, gains 243 real new-grad titles over the old set with 0 lost
  include:
    # role keyword + entry-level qualifier. the separator class allows
    # commas, en/em dashes and slashes, real titles use all of them
    # ("Software Engineer – Early Career" was invisible before)
    - '(?i)(software\s+engineer|software\s+development\s+engineer|swe|sde|sw\s*eng|developer|programmer)[\s,:()\-–—/]*(i\b|1\b|new\s*grad(uate)?|early\s+career|entry\s+level|associate|university|college|campus|graduate|junior)'
    - '(?i)new\s*grad.*software'
    - '(?i)software.*new\s*grad'
    - '(?i)entry[-\s]level.*(engineer|developer|programmer)'
    - '(?i)(engineer|developer|programmer).*entry[-\s]level'
    - '(?i)associate\s+software\s+engineer'
    # anything that says new grad at all, even non-classic titles like
    # "Forward Deployed Engineer - New Grad"
    - '(?i)new\s*grad(uate)?'
    # year-tagged roles, both orders ("Software Engineer (2027 Start)"
    # and Anduril's "2026/2027 Early Career Software Engineer")
    - '(?i)(software|engineer|developer|swe|sde).*\b202[67]\b'
    - '(?i)\b202[67]\b.*(software|engineer|developer|swe|sde)'
    - '(?i)(university|campus|college)\s*(grad(uate)?|hire|recruit)'
    # qualifier-first titles the old set missed entirely:
    # "Graduate Software Engineer", TikTok's "ML Engineer Graduate",
    # "Junior Software Engineer", "Early Career Software Engineer"
    - '(?i)\bgrad(uate)?\b.*\b(software|engineer|developer|swe|sde|machine\s+learning)\b'
    - '(?i)\b(software|engineer(ing)?|developer|swe|sde|machine\s+learning|technology)\b.*\bgrad(uate)?\b'
    - '(?i)(\bjunior\b.*\b(engineer|developer|swe|sde)\b|\b(engineer|developer)\b.*\bjunior\b)'
    - '(?i)early[\s-]+(in[\s-]+)?career'
    - '(?i)recent\s+grad(uate)?'
    - '(?i)emerging\s+talent'
    - '(?i)\bbachelors?\b'
    - '(?i)(leadership|technology|engineering|software|digital)\s+development\s+program'
    - '(?i)(\bassociate\b.*\b(software|developer)\b|\b(software|developer)\b.*\bassociate\b|\bassociate\b\s+((ai|ml|machine\s+learning|deep\s+learning|data)\s+)+engineer\b)'
    - '(?i)(\b(software|developer|engineer(ing)?|tech(nology)?)\b.*\b(apprentice(ship)?|residency|fellowship|rotation(al)?)\b|\b(apprentice(ship)?|residency|fellowship|rotation(al)?)\b.*\b(software|developer|engineer(ing)?|tech(nology)?)\b)'
    # noisiest line: catches "Android Engineer I" at spotify and
    # "ML Engineer 1" but also some hardware/field Engineer 1 roles.
    # delete this one first if the pings get too spammy
    - '(?i)\bengineer\b[\s,:()\-–—/]*(i|1)\b'
  # ...and gets dropped if it contains any of these whole words.
  # this list is what keeps recall-first from becoming spam.
  # "staff" and "lead" are deliberately NOT here: they killed real
  # postings ("Member of Technical Staff New Grad" at AI labs, a
  # TikTok new-grad role on the Lead Ads team) and removing them
  # admitted zero senior noise across the whole audited corpus
  exclude_keywords:
    - intern
    - internship
    - co-op
    - coop
    - senior
    - principal
    - manager
    - director
    - architect
    - phd
    # hr side of campus recruiting kept tripping the early-career
    # patterns ("Early Careers Recruiter"), zero real swe titles lost
    - recruiter
    - coordinator #upl says what
    # "senior" spelled the lazy way, a "Sr. Software Engineer I" leaked
    # right past the senior keyword
    - sr
    # wrong-discipline junk from the 2026-07 audit of 108 real alerts,
    # each keyword checked against all 25k seen titles for collateral
    - field service
    - field engineer
    - sales engineer
    - technical support
    - propulsion
    - mechanical
    - machining
    # also kills one "Data Scientist - GenAI & Autonomous Manufacturing"
    # title, fine with losing that
    - manufacturing
    # NOT plain "production", that kills real titles like "SWE New Grad,
    # Production Infrastructure". meta-style sre roles die too, accepted
    - production engineer
    - process development
    - trainer
    - gnc
    - asic
    - power platform
    - product operations
    - configuration management
    - hvac
    - uipath
    - robotic process automation
  # raw regexes checked against the title AND the url, workday slugs
  # leak start dates the title hides (vanguard's "2026-Start-Date")
  exclude_patterns:
    - '(?i)\b202[0-6][\s_-]*start\b'
  # a posting dies only if EVERY listed location matches one of these,
  # "Toronto | SF" survives and empty/unknown locations always pass
  exclude_locations:
    - canada
    - ontario
    - alberta
    - british columbia
    - toronto
    - ottawa
    - vancouver
    - montreal
    - uk
    - united kingdom
    - london
    - ireland
    - dublin
    - india
    - bangalore
    - bengaluru
    - hyderabad
    - europe
    - emea
    - apac
    - germany
    - france
    - paris
    - netherlands
    - amsterdam
    - poland
    - spain
    - singapore
    - japan
    - tokyo
    - australia
    - sydney
    - china
    - taiwan
    - israel
    - tel aviv
    - brazil
    - mexico
  # simplify feed discipline tags to drop, matched as substrings so
  # legacy "Hardware Engineering" counts. boards have no tag, always pass
  exclude_categories:
    - product
    - hardware
  # ...except simplify files firmware/embedded roles under Hardware,
  # a title with one of these words beats the category
  category_rescue_keywords:
    - software
    - firmware
    - embedded

