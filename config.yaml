# crier production config
# every slug below returned HTTP 200 on a live probe (first batch
# 2026-07-06, expansion batch 2026-07-07).
# pushover creds live in config.local.yaml, NOT here
#
# coverage model: slugs are the fast lane (~60s latency) for companies
# I care about. the github feeds are the dragnet that catches startups
# I've never heard of, at their 5-30 min refresh lag. see a company
# repeatedly in feed alerts? promote it to a slug

db_path: crier.db

filter:
  # includes stay recall-first (wide net), the excludes below do the
  # precision work. title passes if it matches ANY of these (go regexp
  # syntax). this set was audited against 11,906 real titles from the
  # seeded db, gains 243 real new-grad titles over the old set with 0 lost
  include:
    # bare "Software Engineer", no level word. excludes do the work
    - '(?i)\bsoftware\s+(engineer|developer)\b'
    - '(?i)\b(swe|sde)\b'
    # what openai and anthropic call a normal swe role
    - '(?i)member\s+of\s+technical\s+staff'
    # role keyword + entry-level qualifier. the separator class allows
    # commas, en/em dashes and slashes, real titles use all of them
    # ("Software Engineer – Early Career" was invisible before)
    - '(?i)(software\s+engineer|software\s+development\s+engineer|swe|sde|sw\s*eng|developer|programmer)[\s,:()\-–—/]*(i\b|1\b|new\s*grad(uate)?|early\s+career|entry\s+level|associate|university|college|campus|graduate|junior)'
    - '(?i)new\s*grad.*software'
    - '(?i)software.*new\s*grad'
    - '(?i)entry[-\s]level.*(engineer|developer|programmer)'
    - '(?i)(engineer|developer|programmer).*entry[-\s]level'
    - '(?i)associate\s+software\s+engineer'
    # anything that says new grad at all, even non-classic titles like
    # "Forward Deployed Engineer - New Grad"
    - '(?i)new\s*grad(uate)?'
    # year-tagged roles, both orders ("Software Engineer (2027 Start)"
    # and Anduril's "2026/2027 Early Career Software Engineer")
    - '(?i)(software|engineer|developer|swe|sde).*\b202[67]\b'
    - '(?i)\b202[67]\b.*(software|engineer|developer|swe|sde)'
    - '(?i)(university|campus|college)\s*(grad(uate)?|hire|recruit)'
    # jump trading and five rings lead with the program word instead
    # ("Campus Software Engineer (Full-Time)"), which the rule above
    # misses. anchored to the title start on purpose, otherwise a
    # "College of Engineering" postdoc listing matches too
    - '(?i)^\s*(campus|university|college)\b.*\b(software|engineer(ing)?|developer|swe|sde|programmer)\b'
    # qualifier-first titles the old set missed entirely:
    # "Graduate Software Engineer", TikTok's "ML Engineer Graduate",
    # "Junior Software Engineer", "Early Career Software Engineer"
    - '(?i)\bgrad(uate)?\b.*\b(software|engineer|developer|swe|sde|machine\s+learning)\b'
    # "research" is only in the second line, not the first. bytedance
    # names its new grad roles "Research Scientist Graduate", but
    # "Graduate Research Assistant" is a university job, not for me
    - '(?i)\b(software|engineer(ing)?|developer|swe|sde|machine\s+learning|technology|research)\b.*\bgrad(uate)?\b'
    - '(?i)(\bjunior\b.*\b(engineer|developer|swe|sde)\b|\b(engineer|developer)\b.*\bjunior\b)'
    - '(?i)early[\s-]+(in[\s-]+)?career'
    - '(?i)recent\s+grad(uate)?'
    - '(?i)emerging\s+talent'
    - '(?i)\bbachelors?\b'
    - '(?i)(leadership|technology|engineering|software|digital)\s+development\s+program'
    # "associate" is a real entry-level marker at trading firms and
    # startups, but the old rule only allowed a fixed list of specialties
    # between it and "engineer", so CTC's plain "Associate Engineer" and
    # "Associate Forward Deployed Engineer" both died. the {0,30} keeps
    # it from leaping across a whole title into an unrelated word
    - '(?i)(\bassociate\b.*\b(software|developer)\b|\b(software|developer)\b.*\bassociate\b|\bassociate\b[\s\w/&.,()-]{0,30}\bengineer\b|\bengineer(ing)?\b[\s\w/&.,()-]{0,20}\bassociate\b)'
    - '(?i)(\b(software|developer|engineer(ing)?|tech(nology)?)\b.*\b(apprentice(ship)?|residency|fellowship|rotation(al)?)\b|\b(apprentice(ship)?|residency|fellowship|rotation(al)?)\b.*\b(software|developer|engineer(ing)?|tech(nology)?)\b)'
    # noisiest line: catches "Android Engineer I" at spotify and
    # "ML Engineer 1" but also some hardware/field Engineer 1 roles.
    # delete this one first if the pings get too spammy
    # the optional "level" catches "Software Engineer Level 1", the
    # separators alone can't jump over a whole word. II and 2 stay out
    - '(?i)\bengineer\b[\s,:()\-–—/]*(level\s*)?(i|1)\b'
  # ...and gets dropped if it contains any of these whole words.
  # this list is what keeps recall-first from becoming spam.
  # "staff" and "lead" are deliberately NOT here as keywords: they
  # killed real postings ("Member of Technical Staff New Grad", a
  # TikTok role on the Lead Ads team). the rank form is an
  # exclude_pattern instead, needed since bare "Software Engineer"
  # started matching
  exclude_keywords:
    - intern
    - internship
    - co-op
    - coop
    - senior
    - distinguished
    - principal
    - manager
    - director
    - architect
    - phd
    - phds # whole-word matching means the plural needs its own entry
    # hr side of campus recruiting kept tripping the early-career
    # patterns ("Early Careers Recruiter"), zero real swe titles lost
    - recruiter
    - coordinator #upl says what
    # "senior" spelled the lazy way, a "Sr. Software Engineer I" leaked
    # right past the senior keyword
    - sr
    # wrong-discipline junk from the 2026-07 audit of 108 real alerts,
    # each keyword checked against all 25k seen titles for collateral
    - field service
    - field engineer
    - sales engineer
    - technical support
    - propulsion
    - mechanical
    - machining
    # also kills one "Data Scientist - GenAI & Autonomous Manufacturing"
    # title, fine with losing that
    - manufacturing
    # NOT plain "production", that kills real titles like "SWE New Grad,
    # Production Infrastructure". meta-style sre roles die too, accepted
    - production engineer
    - process development
    - trainer
    - gnc
    - asic
    - power platform
    - product operations
    - configuration management
    - hvac
    - uipath
    - robotic process automation
    # second audit 2026-07-17: wrong-discipline titles that slipped the
    # first pass, mostly aero/defense/semiconductor and IT-ops postings
    - electrical
    - hardware engineer
    - fluids
    - phased array
    - flight test
    - test & evaluation
    - test and evaluation
    - aerostructures
    - site engineer
    - yield enhancement
    - business intelligence
    - gas turbine
    - servicenow
    - launch operations
    - ground systems
    - it systems
    - communication systems
    - support engineering
    - engineer/analyst
    - automation developer
    # google's wide-net early-us source lists sales roles too, and their
    # ads org (Google Customer Solutions) tags them University Graduate
    - customer growth
    - account strategist
    - customer solutions
    # third audit 2026-08-06: the widened "associate" rule pulls in a few
    # non-swe families, these four kill them and cost zero real titles.
    # NOT "application/design/systems engineer", those read as noise but
    # each one kills real new-grad roles (appian, micron, blissway)
    - professor
    - value engineer # pre-sales, not an ic engineering role
    - service engineer # "field service" already covers the field variant
    - engineering support
    # fifth audit 2026-08-12, first one looking at PRECISION instead of
    # recall. checked every candidate against the 1,233 titles that pass
    # the filter today, these nine cost zero real roles between them
    - test engineer # 7 kills, all avionics/rf/environmental rigs
    - support engineer # 12 kills, all IT and desk support. this also
    # takes HRT's "Junior Electronic Trading Support Engineer", which
    # sirened through dnd as a priority company. deliberate, it's
    # production support and not the job I want
    - field application engineer # pre-sales. NOT bare "application
    # engineer", that one kills appian's real new grad cohort role
    - solution engineer
    - solutions engineer
    - customer engineer # gcp-style pre-sales, not an ic role
    - customer experience associate # NOT bare "customer experience",
    # that kills a real "SDE I, Customer Experience" team role
    - business technology
    - weld engineer
    - aerodynamics
    # the non-swe tail of the widened "associate" rule. that rule is
    # worth 104 titles including CTC's "Associate Engineer" and every
    # "Associate Forward Deployed Engineer", so it stays. these seven
    # kill the hardware/IT stragglers it drags along, 13 titles, no
    # software lost
    - bi engineer # "business intelligence" already covers the long form
    - analog
    - rf engineer
    - radio frequency
    - hardware design # "hardware engineer" misses the design variant
    - electronics packaging
    - microsoft 365
    # NOT "vision systems": machine vision reads like hardware but
    # computer vision roles are real ml work
    # NOT "avionics" or "spacecraft": both read like pure hardware but
    # each kills two real embedded swe roles at rocket lab and boeing.
    # NOT "product engineer" either, esri's arcgis sdk role is software
  # raw regexes checked against the title AND the url, workday slugs
  # leak start dates the title hides (vanguard's "2026-Start-Date")
  exclude_patterns:
    # level 3 and up. I, 1, II and 2 stay, google uses "II" for
    # its early-career programs
    - '(?i)\b(engineer|developer|swe|sde)[\s\-]*(iii+|iv)\b'
    - '(?i)\b(engineer|developer)\s+(level\s*)?[3-9]\b'
    # the rank only, not "Member of Technical Staff" or "Lead Ads"
    - '(?i)\b(staff|lead)\+?\s+([\w-]+\s+){0,3}(engineer|developer|scientist)\b'
    - '(?i)\b202[0-6][\s_-]*start\b'
    # I graduate dec 2026 and start in 2027, so 2026-and-earlier cohort
    # tags are all wrong-year junk. workday urls keep the year even when
    # a feed strips it from the title (New-College-Grad-2026_JR2021230)
    - '(?i)grad(uate)?s?[\s_-]+202[0-6](\D|$)'
    # nvidia writes the year first too ("2026 New College Grad"), which
    # the grad-then-year rule above misses. req numbers like JR2026...
    # are safe: no word boundary sits between a letter and the year
    - '(?i)\b202[0-6][\s_-]+(new[\s_-]+)?(college[\s_-]+)?grad'
    - '(?i)early[\s_-]+career[\s_-]+202[0-6](\D|$)'
    # workday prefixes XMLNAME- when a title starts with a year, this
    # catches "2026 Raytheon Full-Time Software Engineer I" style reqs
    - '(?i)xmlname-202[0-6]-'
    - '(?i)^\s*202[0-6]\b'
    # eligibility windows, but only ones that END by 2026. doordash's
    # "(Graduation Date: Fall 2025-Summer 2026)" dies, a window running
    # into 2027 would still pass
    - '(?i)graduation[\s_-]+date[^)]*202[0-6]\s*\)'
  # a posting dies only if EVERY listed location matches one of these,
  # "Toronto | SF" survives and empty/unknown locations always pass
  exclude_locations:
