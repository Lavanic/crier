  # big-tech careers pages, these companies aren't on any public ats
  # board. the job json is embedded in the page html and the server
  # does the filtering via url params, page 1 = 20 newest matches.
  # gentle 5 min default cadence on purpose, these are consumer sites
  google:
    # tight net: quoted-phrase query, low volume
    - name: swe-early-us
      url: https://www.google.com/about/careers/applications/jobs/results?q=%22software%20engineer%22&target_level=EARLY&location=United%20States&sort_by=date
    # wide net: every early-career us posting (the title filter kills
    # the data center technician flood). same job in both queries
    # dedups by id, so add query variants freely
    - name: early-us
      url: https://www.google.com/about/careers/applications/jobs/results?target_level=EARLY&location=United%20States&sort_by=date
  apple:
    # apple rarely labels roles new-grad, so expect low volume: only
    # titles with early career/graduate/engineer I markers get through
    - name: swe-us-newest
      url: https://jobs.apple.com/en-us/search?search=software%20engineer&sort=newest&location=united-states-USA
  # netflix runs on eightfold, its careers api returns clean json.
  # sort_by=timestamp is newest-create-first, and the api hard-caps at
  # 10 results per page no matter what num says. 10 newest per 5-min
  # poll is plenty: netflix would have to post 10+ roles inside one
  # window for a new one to roll off page 1 before we see it
  netflix:
    - name: newest
      url: https://explore.jobs.netflix.net/api/apply/v2/jobs?domain=netflix.com&sort_by=timestamp&start=0&num=10
  # any myworkdayjobs tenant. url is the cxs /jobs endpoint, search
  # trims the result set to page 1 (workday hard-caps limit at 20).
  # note: nvidia's new-grad reqs are all tagged 2026 right now, so the
  # wrong-year rule kills them until the 2027 cohort opens, that's fine,
  # this mostly buys latency for when it does
  workday:
    - name: nvidia
      company: NVIDIA
      url: https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs
